services:
  web:
    image: php:8.1-apache
    ports:
      - "80:80"
    volumes:
      - ./html:/var/www/html

    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_database
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
